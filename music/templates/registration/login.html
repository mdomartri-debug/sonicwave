
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SonicWave</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #24e0bd;
            --accent-dark: #0bb99a;
            --bg: #080b12;
            --card: rgba(18, 25, 37, 0.82);
            --text: #f5f7fa;
            --muted: #8b97a9;
            --border: rgba(255,255,255,0.09);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    ellipse at 15% 15%,
                    rgba(36,224,189,.13),
                    transparent 40%
                ),
                radial-gradient(
                    ellipse at 90% 85%,
                    rgba(74,100,255,.13),
                    transparent 40%
                ),
                var(--bg);

            overflow-x: hidden;
        }

        /* Animated background */

        .orb {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .15;
            pointer-events: none;
            animation: float 9s ease-in-out infinite alternate;
        }

        .orb.one {
            background: #24e0bd;
            top: -100px;
            left: -80px;
        }

        .orb.two {
            background: #536dfe;
            bottom: -120px;
            right: -70px;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(40px, 35px);
            }
        }

        /* Main wrapper */

        .login-wrapper {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 2;
            animation: appear .8s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SonicWave branding */

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;

            background: linear-gradient(
                135deg,
                #24e0bd,
                #0a9f89
            );

            color: #06120f;
            font-size: 27px;
            font-weight: 800;

            box-shadow:
                0 8px 35px rgba(36,224,189,.25);
        }

        .brand h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 29px;
            letter-spacing: -1px;
            font-weight: 800;
        }

        .brand h2 span {
            color: var(--accent);
        }

        .brand p {
            margin-top: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        /* Login card */

        .login-card {
            padding: 42px 38px;

            border: 1px solid var(--border);
            border-radius: 25px;

            background: var(--card);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 25px 80px rgba(0,0,0,.4);
        }

        /* Heading */

        .heading {
            margin-bottom: 30px;
        }

        .heading h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            letter-spacing: -1px;
        }

        .heading p {
            margin-top: 9px;
            color: var(--muted);
            font-size: 14px;
        }

        .heading p span {
            color: var(--accent);
        }

        /* Django form styling */

        form p {
            margin-bottom: 19px;
        }

        form label {
            display: block;
            margin-bottom: 9px;
            color: #dce3ed;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 15px 16px;

            color: white;
            background: rgba(255,255,255,.035);

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 11px;

            outline: none;
            font-family: inherit;
            font-size: 14px;

            transition: .25s ease;
        }

        input:focus {
            border-color: var(--accent);

            background: rgba(36,224,189,.045);

            box-shadow:
                0 0 0 4px rgba(36,224,189,.09);
        }

        input::placeholder {
            color: #647084;
        }

        .helptext {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 11px;
        }

        .errorlist {
            list-style: none;
            margin-bottom: 8px;
            color: #ff7777;
            font-size: 12px;
        }

        /* Login button */

        .submit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 16px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(
                110deg,
                #24e0bd,
                #0bb99a
            );

            color: #061511;
            font-size: 14px;
            font-weight: 800;
            font-family: inherit;

            cursor: pointer;
            transition: .3s ease;

            box-shadow:
                0 8px 25px rgba(36,224,189,.15);
        }

        .submit-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 35px rgba(36,224,189,.3);
        }

        .submit-btn:active {
            transform: scale(.98);
        }

        /* Divider */

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 26px 0;

            color: #667184;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--border);
        }

        /* Back link */

        .back-link {
            display: block;
            text-align: center;

            color: var(--accent);
            font-size: 13px;
            font-weight: 600;

            text-decoration: none;
            transition: .2s;
        }

        .back-link:hover {
            color: white;
        }

        /* Footer */

        .footer {
            text-align: center;
            margin-top: 25px;

            color: #657184;
            font-size: 11px;
        }

        .footer span {
            color: var(--accent);
        }

        /* Mobile responsive */

        @media(max-width: 480px) {
            .login-card {
                padding: 32px 23px;
            }

            .heading h1 {
                font-size: 28px;
            }

            .brand h2 {
                font-size: 26px;
            }
        }

    </style>
</head>

<body>

    <!-- Animated background -->
    <div class="orb one"></div>
    <div class="orb two"></div>

    <main class="login-wrapper">

        <!-- SonicWave Brand -->
        <div class="brand">

            <div class="brand-icon">S</div>

            <h2>
                Sonic<span>Wave.</span>
            </h2>

            <p>
                Feel the sound. Live the moment.
            </p>

        </div>

        <!-- Login Section -->
        <section class="login-card">

            <div class="heading">

                <h1>Welcome back.</h1>

                <p>
                    Sign in to continue your
                    <span>music journey.</span>
                </p>

            </div>

            <!-- Django Authentication -->
            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="submit-btn">
                    Sign In &nbsp; →
                </button>

            </form>

            <div class="divider">
                YOUR MUSIC IS WAITING
            </div>

            <a href="{% url 'song_list' %}" class="back-link">
                ← Explore all songs
            </a>

        </section>

        <!-- Footer -->
        <div class="footer">
            Crafted for music lovers.
            <span>Made with ♥</span>
        </div>

    </main>

</body>
</html>
